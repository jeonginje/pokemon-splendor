<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스플렌더: 포켓몬 (Splendor: Pokemon)</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- Firebase Compat CDN (v10.8.0) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Firebase Realtime Database 설정 및 초기화 스크립트 -->
    <script>
      // 🔥 Firebase Config: Firebase 콘솔에서 발급받은 본인의 설정을 여기에 입력하세요.
      const firebaseConfig = {
        apiKey: "",
        authDomain: "",
        databaseURL: "", // Realtime Database URL (예: https://your-project-id-default-rtdb.firebaseio.com)
        projectId: "",
        storageBucket: "",
        messagingSenderId: "",
        appId: ""
      };

      // 전역 객체에 공유하여 앱 내부에서도 감지할 수 있도록 등록
      window.firebaseConfig = firebaseConfig;

      // Firebase 초기화 (설정값이 입력되었을 때 자동 활성화)
      if (typeof firebase !== 'undefined' && firebaseConfig.apiKey && (firebaseConfig.databaseURL || firebaseConfig.projectId)) {
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          window.firebaseDb = firebase.database();
          console.log('[Firebase CDN] Realtime Database initialized successfully.');
        } catch (e) {
          console.error('[Firebase CDN] Initialization error:', e);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
